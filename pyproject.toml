[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chirag"
version = "1.0.0"
description = "Chirag: a locally-deployable, citation-aware retrieval-augmented generation system for cryptography and cryptanalysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chirag" }]
dependencies = [
    "chromadb>=1.5.0",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "openai>=1.30",
    "textual>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
]

[project.scripts]
chirag = "chirag.cli:main"

[tool.setuptools]
packages = ["chirag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptoRAG - Cryptography &amp; Cryptanalysis RAG System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d14; --card:#121824; --card2:#182234; --border:#1e293b;
  --cyan:#00f2fe; --blue:#4facfe; --gold:#ffb703; --green:#00f5d4;
  --text:#f1f5f9; --muted:#94a3b8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;
  background-image:
    radial-gradient(circle at 15% 10%,rgba(0,242,254,.06),transparent 40%),
    radial-gradient(circle at 85% 90%,rgba(255,183,3,.06),transparent 40%);
}
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:1rem 2rem;background:rgba(18,24,36,.85);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;
}
.logo{font-weight:700;font-size:1.15rem}
.logo span{color:var(--cyan)}
.stats{display:flex;gap:1.2rem;font-size:.8rem;color:var(--muted)}
.stats b{color:var(--text);font-weight:600}
nav{display:flex;gap:1rem;padding:1rem 2rem;border-bottom:1px solid var(--border)}
nav button{
  background:none;border:1px solid var(--border);color:var(--muted);
  padding:.5rem 1.2rem;border-radius:10px;cursor:pointer;font-size:.9rem;
  transition:.15s;
}
nav button:hover{color:var(--text);border-color:var(--cyan)}
nav button.active{background:linear-gradient(135deg,var(--cyan),var(--blue));
  color:#06121f;font-weight:600;border-color:transparent}
main{padding:1.5rem 2rem;max-width:1100px;margin:0 auto}
.panel{display:none}
.panel.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:1.25rem;margin-bottom:1.25rem}
.card h3{font-size:.95rem;margin-bottom:1rem;color:var(--cyan)}
textarea{width:100%;min-height:110px;background:var(--card2);color:var(--text);
  border:1px solid var(--border);border-radius:10px;padding:.8rem;resize:vertical;
  font-family:'JetBrains Mono',monospace;font-size:.86rem}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--cyan)}
.row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;margin:.9rem 0}
input[type=text],input[type=number],select{
  background:var(--card2);color:var(--text);border:1px solid var(--border);
  border-radius:8px;padding:.5rem .7rem;font-size:.85rem}
label{font-size:.78rem;color:var(--muted)}
button.primary{
  background:linear-gradient(135deg,var(--cyan),var(--blue));color:#06121f;
  border:none;padding:.6rem 1.4rem;border-radius:9px;font-weight:600;
  cursor:pointer;font-size:.88rem}
button.primary:hover{filter:brightness(1.1)}
button.primary:disabled{opacity:.5;cursor:wait}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{text-align:left;color:var(--muted);font-weight:500;padding:.5rem;border-bottom:1px solid var(--border)}
td{padding:.5rem;border-bottom:1px solid rgba(30,41,59,.5);vertical-align:top}
.pill{display:inline-block;padding:.15rem .55rem;border-radius:20px;font-size:.7rem;
  border:1px solid var(--border);color:var(--muted)}
.pill.rfc{color:var(--cyan);border-color:var(--cyan)}
.pill.nist{color:var(--gold);border-color:var(--gold)}
.pill.paper{color:var(--green);border-color:var(--green)}
.answer{white-space:pre-wrap;line-height:1.65;font-size:.9rem}
.source{margin-top:.9rem;background:var(--card2);border:1px solid var(--border);
  border-radius:10px;padding:.7rem .9rem;font-size:.78rem}
.source b{color:var(--cyan)}
.srcline{font-size:.74rem;color:var(--muted);margin-top:.25rem;word-break:break-all}
.loader{display:inline-block;width:14px;height:14px;border:2px solid var(--card2);
  border-top-color:var(--cyan);border-radius:50%;animation:spin .7s linear infinite;
  vertical-align:middle;margin-right:.4rem}
@keyframes spin{to{transform:rotate(360deg)}}
.muted{color:var(--muted);font-size:.8rem}
.del{background:none;border:1px solid #7f1d1d;color:#f87171;border-radius:6px;
  padding:.2rem .6rem;cursor:pointer;font-size:.72rem}
.del:hover{background:#7f1d1d;color:#fff}
h2{font-size:1.1rem;margin-bottom:1rem}
</style>
</head>
<body>
<header>
  <div class="logo">Crypto<span>RAG</span></div>
  <div class="stats" id="stats"><span>chunks: --</span><span>docs: --</span><span>RFCs: --</span></div>
</header>
<nav>
  <button data-panel="chat" class="active">RAG Chat</button>
  <button data-panel="library">Knowledge Base</button>
  <button data-panel="ingest">Ingest</button>
</nav>

<main>
  <!-- ============================= CHAT ============================= -->
  <section id="panel-chat" class="panel active">
    <div class="card">
      <h3>Ask the knowledge base</h3>
      <textarea id="question" placeholder="e.g. What is the data complexity of linear cryptanalysis against 16-round DES?"></textarea>
      <div class="row">
        <div><label>Model</label><br><select id="model"></select></div>
        <div><label>Top-K</label><br><input type="number" id="topk" value="5" min="1" max="20" style="width:70px"></div>
        <div><label>Document type</label><br>
          <select id="docfilter">
            <option value="All">All</option>
            <option>RFC Document</option>
            <option>NIST Standard</option>
            <option>Cryptanalysis Paper</option>
            <option>Cryptography Paper</option>
          </select>
        </div>
      </div>
      <button class="primary" id="askbtn">Generate answer</button>
    </div>
    <div class="card" id="answerbox" style="display:none">
      <h3>Answer</h3>
      <div class="answer" id="answer"></div>
      <div id="sources"></div>
    </div>
  </section>

  <!-- =========================== LIBRARY ============================ -->
  <section id="panel-library" class="panel">
    <div class="card">
      <h3>Indexed documents</h3>
      <table>
        <thead><tr><th>Title</th><th>Type</th><th>Chunks</th><th></th></tr></thead>
        <tbody id="doctable"></tbody>
      </table>
      <p class="muted" id="docsempty" style="margin-top:.8rem"></p>
    </div>
  </section>

  <!-- ============================ INGEST =========================== -->
  <section id="panel-ingest" class="panel">
    <div class="card">
      <h3>Ingest IETF RFC</h3>
      <div class="row">
        <input type="number" id="rfcnum" placeholder="RFC number, e.g. 9180" style="width:180px">
        <button class="primary" id="rfcbtn">Fetch &amp; index</button>
      </div>
      <p class="muted" id="rfcmsg"></p>
    </div>
    <div class="card">
      <h3>Ingest web article</h3>
      <div class="row">
        <input type="text" id="url" placeholder="https://..." style="flex:1;min-width:260px">
        <button class="primary" id="urlbtn">Scrape &amp; index</button>
      </div>
      <p class="muted" id="urlmsg"></p>
    </div>
    <div class="card">
      <h3>Upload local file (PDF / TXT / MD)</h3>
      <div class="row">
        <input type="file" id="file" accept=".pdf,.txt,.md">
        <button class="primary" id="filebtn">Upload &amp; index</button>
      </div>
      <p class="muted" id="filemsg"></p>
    </div>
  </section>
</main>

<script>
const $=id=>document.getElementById(id);
const api=async(p,o={})=>{
  const r=await fetch(p,{headers:{'Content-Type':'application/json'},
    method:o.method||'POST',body:o.body?JSON.stringify(o.body):undefined});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.detail||d.message||r.statusText);
  return d;
};
const pill=t=>{
  const cls=t.includes('RFC')?'rfc':t.includes('NIST')?'nist':'paper';
  return `<span class="pill ${cls}">${t}</span>`;
};

async function loadStats(){
  try{
    const s=await api('/api/stats',{method:'GET'});
    $('stats').innerHTML=`<span>chunks: <b>${s.total_chunks}</b></span>`+
      `<span>docs: <b>${s.total_documents}</b></span>`+
      `<span>RFCs: <b>${s.rfc_count}</b></span>`+
      `<span>NIST: <b>${s.nist_count}</b></span>`+
      `<span>papers: <b>${s.paper_count}</b></span>`;
  }catch(e){}
}
async function loadModels(){
  try{
    const d=await api('/api/models',{method:'GET'});
    const sel=$('model');
    sel.innerHTML='';
    d.models.forEach(m=>{
      const o=document.createElement('option');
      o.value=m.name;o.textContent=m.name;
      if(m.name===d.active)o.selected=true;
      sel.appendChild(o);
    });
    if(!d.models.length){
      const o=document.createElement('option');
      o.value=d.active;o.textContent=d.active+' (fallback)';sel.appendChild(o);
    }
  }catch(e){alert('Cannot reach backend: '+e.message);}
}
async function loadDocs(){
  try{
    const d=await api('/api/documents',{method:'GET'});
    const tb=$('doctable');
    tb.innerHTML='';
    $('docsempty').textContent = d.documents.length? '':'No documents indexed yet.';
    d.documents.forEach(doc=>{
      const tr=document.createElement('tr');
      tr.innerHTML=`<td><b>${doc.title.replace(/</g,'&lt;')}</b>`+
        `<div class="srcline">${doc.source.replace(/</g,'&lt;')}</div></td>`+
        `<td>${pill(doc.type)}</td><td>${doc.chunk_count}</td>`+
        `<td><button class="del" data-src="${encodeURIComponent(doc.source)}">delete</button></td>`;
      tb.appendChild(tr);
    });
    tb.querySelectorAll('.del').forEach(b=>b.addEventListener('click',async()=>{
      if(!confirm('Delete this document from the index?'))return;
      await fetch('/api/documents?source='+b.dataset.src,{method:'DELETE'});
      loadDocs();loadStats();
    }));
  }catch(e){alert(e.message)}
}

document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  b.classList.add('active');
  $('panel-'+b.dataset.panel).classList.add('active');
}));

$('askbtn').addEventListener('click',async()=>{
  const q=$('question').value.trim();
  if(!q)return;
  const btn=$('askbtn');btn.disabled=true;
  btn.innerHTML='<span class="loader"></span>Retrieving &amp; generating...';
  $('answerbox').style.display='none';
  try{
    const d=await api('/api/query',{body:{
      question:q,top_k:+$('topk').value,model:$('model').value,
      doc_type_filter:$('docfilter').value}});
    $('answer').textContent=d.answer||'';
    $('sources').innerHTML=(d.sources||[]).map(s=>
      `<div class="source"><b>[SOURCE ${s.id}]</b> ${s.title.replace(/</g,'&lt;')}
       <div class="srcline">${s.source.replace(/</g,'&lt;')} &middot; type: ${s.type} &middot; sim: ${(s.similarity??0).toFixed(3)}</div></div>`
    ).join('');
    $('answerbox').style.display='block';
  }catch(e){alert(e.message)}
  btn.disabled=false;btn.textContent='Generate answer';
});

$('rfcbtn').addEventListener('click',async()=>{
  const n=+$('rfcnum').value;if(!n)return;
  $('rfcmsg').textContent='Fetching RFC '+n+' ...';
  try{const d=await api('/api/ingest/rfc',{body:{rfc_number:n}});
    $('rfcmsg').textContent=`✔ ${d.title} — ${d.chunks_added} chunks indexed.`;
    loadDocs();loadStats();
  }catch(e){$('rfcmsg').textContent='✖ '+e.message;}
});
$('urlbtn').addEventListener('click',async()=>{
  const u=$('url').value.trim();if(!u)return;
  $('urlmsg').textContent='Scraping '+u+' ...';
  try{const d=await api('/api/ingest/url',{body:{url:u}});
    $('urlmsg').textContent=`✔ ${d.title} — ${d.chunks_added} chunks indexed.`;
    loadDocs();loadStats();
  }catch(e){$('urlmsg').textContent='✖ '+e.message;}
});
$('filebtn').addEventListener('click',async()=>{
  const f=$('file').files[0];if(!f)return;
  $('filemsg').textContent='Uploading '+f.name+' ...';
  const fd=new FormData();fd.append('file',f);
  try{
    const r=await fetch('/api/ingest/file',{method:'POST',body:fd});
    const d=await r.json();
    if(!r.ok)throw new Error(d.detail||r.statusText);
    $('filemsg').textContent=`✔ ${d.title} — ${d.chunks_added} chunks indexed.`;
    loadDocs();loadStats();
  }catch(e){$('filemsg').textContent='✖ '+e.message;}
});

loadStats();loadModels();loadDocs();
</script>
</body>
</html>
